:root{
  --bg:#E9EEF1; --ink:#14283D; --muted:#566779; --tile:#FFFFFF; --line:#C5D0D9;
  --sun:#F4C430; --sun-ink:#14283D; --sea:#1D5C96; --ok:#2F7A55; --ok-bg:#DDEFE5;
  --bad:#B83A3A; --bad-bg:#F6DEDE; --shadow:0 1px 0 rgba(20,40,61,.12);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B28; --ink:#E4EBF2; --muted:#93A4B5; --tile:#172737; --line:#2B3E52;
    --sun:#E8B923; --sun-ink:#0F1B28; --sea:#78AEE0; --ok:#6CC495; --ok-bg:#173A2A;
    --bad:#F08A8A; --bad-bg:#3E1C1F; --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B28; --ink:#E4EBF2; --muted:#93A4B5; --tile:#172737; --line:#2B3E52;
  --sun:#E8B923; --sun-ink:#0F1B28; --sea:#78AEE0; --ok:#6CC495; --ok-bg:#173A2A;
  --bad:#F08A8A; --bad-bg:#3E1C1F; --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

header{max-width:1180px;margin:0 auto;padding:18px 20px 8px;display:grid;gap:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--sans);font-weight:400;font-size:15px;color:var(--muted);margin-left:10px;letter-spacing:0}
.stats{display:flex;gap:22px;align-items:baseline}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:10px}
.controls label{display:flex;align-items:center;gap:6px}
.controls input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--tile)}
.controls select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--tile)}
.controls .spacer{flex:1}
.settings summary{display:none}
@media (max-width:559px){
  .settings summary{display:block;cursor:pointer;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  .settings[open] summary{margin-bottom:8px}
  .settings .controls{border-top:0;padding-top:0}
}
.btn{border:1px solid var(--line);background:var(--tile);border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--bg);font-weight:700}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
.progress-note{font-size:13px;color:var(--muted);margin-top:-6px}

main{max-width:1180px;margin:0 auto;padding:4px 20px 60px}
.board{position:relative;width:100%;min-height:420px}
/* Nordic cross, offset toward the hoist like the flag */
.board::before,.board::after{content:"";position:absolute;background:var(--line);opacity:.55;pointer-events:none}
.board::before{left:0;right:0;top:50%;height:2px;transform:translateY(-1px)}
.board::after{top:0;bottom:0;left:var(--cross-x,40%);width:2px}
.board.grid::before,.board.grid::after{display:none}

.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.disc{min-width:260px;max-width:min(520px,92vw);border-radius:16px;background:var(--sun);color:var(--sun-ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:20px 32px 18px}
.lemma{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1.05;word-break:break-word}
.lemma.long{font-size:30px}
.pos{font-size:13px;margin-top:6px;opacity:.8}
.stack-toggle{border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer;
  box-shadow:var(--shadow);white-space:nowrap}
.stack-toggle[aria-expanded=true]{border-color:var(--sea)}
.stack{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;min-width:250px;list-style:none;padding:8px 0;
  background:var(--tile);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
.stack li{display:flex;justify-content:space-between;gap:18px;padding:5px 14px}
.stack li+li{border-top:1px solid var(--line)}
.stack .f{font-family:var(--serif);font-weight:500;font-size:18px}
.stack .lab{font-size:13px;color:var(--muted);text-align:right}
.stack li.todo .f{color:var(--muted);letter-spacing:.2em}
.stack li.new{animation:flash .7s}
@keyframes flash{from{background:var(--ok-bg)}to{background:transparent}}
.done-row,.stack li.done-row{display:flex;justify-content:center;gap:10px;padding:8px 12px 4px}
.stack li.en-row{display:block;background:var(--bg);padding:8px 14px}
.en-lab{display:block;font-size:12px;color:var(--muted)}
.en{font-size:16px}

.phrase-card{background:var(--tile);border:2px solid var(--sun);border-radius:16px;padding:18px 24px;max-width:min(640px,92vw);text-align:center}
.phrase{font-family:var(--serif);font-size:24px;line-height:1.5}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--sun);color:transparent;line-height:1.2}
.blank.filled{color:var(--ok);border-color:var(--ok)}
.gloss{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.4em}
.phrase-tag{font-size:13px;color:var(--muted);margin-bottom:6px}

.tile{position:absolute;left:0;top:0;z-index:1;border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:7px 12px;
  font-size:17px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .45s,background .2s,border-color .2s}
.tile:hover{border-color:var(--sea)}
.tile.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .38s}
.tile.spent{opacity:.35;cursor:default;pointer-events:none}
.tile.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);pointer-events:none}
.tile.gone{opacity:0;pointer-events:none}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}

/* narrow screens: centre on top, tiles flow below */
.board.grid{display:flex;flex-direction:column;align-items:center;gap:22px;min-height:0;padding-top:14px}
.board.grid .core{order:-1;position:relative;left:auto;top:auto;transform:none}
.board.grid .stack{position:relative;top:auto;left:auto;transform:none;margin-top:0}
.board.grid .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:900px}
.board.grid .tile{position:relative;transform:none!important}
.board.grid .tile.gone{display:none}

.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(15,27,40,.55)}
.overlay canvas{position:absolute;inset:0;width:100%;height:100%}
.overlay .msg{position:relative;background:var(--tile);border-radius:14px;padding:26px 30px;text-align:center;max-width:90vw}
.overlay .msg h2{font-family:var(--serif);font-size:30px;margin:0 0 6px}
.overlay .msg p{margin:0 0 16px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  .tile{transition:none}.tile.wrong{animation:none}.stack li.new{animation:none}.progress i{transition:none}
}
@media (max-width:559px){.disc{min-width:0;width:100%;padding:16px 20px}.lemma{font-size:30px}.lemma.long{font-size:25px}.stats{gap:18px}.phrase{font-size:21px}.phrase-card{padding:14px 16px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Formjakt<small>hitta alla former av ordet</small></h1>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sLevel">1</b><span>nivå</span></div>
      <div class="stat"><b id="sDone">0</b><span>klara ord</span></div>
      <div class="stat bad"><b id="sMiss">0</b><span>fel</span></div>
    </div>
  </div>
  <details class="settings" id="settings" open><summary>Inställningar</summary>
  <div class="controls">
    <label>Ord runt målet <input type="number" id="cCount" min="4" max="40" step="1" value="20"></label>
    <label>Ordförråd
      <select id="cBand">
        <option value="0-3000">alla 3000</option>
        <option value="0-1000">1–1000</option>
        <option value="1000-2000">1001–2000</option>
        <option value="2000-3000">2001–3000</option>
      </select>
    </label>
    <label>Ordning
      <select id="cOrder"><option value="rand">slumpad</option><option value="freq">vanligast först</option></select>
    </label>
    <label><input type="checkbox" id="cLook" checked> liknande ord som fällor</label>
    <span class="spacer"></span>
    <button class="btn" id="bSkip" type="button">Hoppa över</button>
    <button class="btn" id="bReset" type="button">Nollställ</button>
  </div></details>
  <div class="progress" aria-hidden="true"><i id="pBar"></i></div>
  <div class="progress-note" id="pNote"></div>
</header>
<main>
  <div class="board" id="board"><div class="tiles" id="tiles"></div></div>
  <p class="sr" id="live" aria-live="assertive"></p>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {

}
</script>
</main>

/* ---------- data ---------- */
const VOCAB = VOCAB_RAW.split("\n").map((line, rank) => {
  const [l, p, fs] = line.split("\t");
  const forms = fs.split(",").map(x => { const [f, li] = x.split(":"); return { f, lab: LABELS[+li] }; });
  return { rank, l, pos: POSES[+p], forms, uninfl: forms.length === 1 };
});
const GLOSS = GLOSS_RAW.split("\n");
const PHRASES = PHRASES_RAW.split("\n").map(x => { const [sv, en] = x.split("|"); return { sv, en }; });
const OWNERS = new Map();               // form string -> [vocab idx]
VOCAB.forEach((v, i) => v.forms.forEach(({ f }) => { if (!OWNERS.has(f)) OWNERS.set(f, []); OWNERS.get(f).push(i); }));
const ALL_FORMS = [...OWNERS.keys()];
const BY_PREFIX = new Map();            // 3-letter prefix -> forms
for (const f of ALL_FORMS) { const k = f.slice(0, 3); if (!BY_PREFIX.has(k)) BY_PREFIX.set(k, []); BY_PREFIX.get(k).push(f); }

/* ---------- storage ---------- */
const KEY = "formjakt:v1";
const defaults = () => ({ settings: { count: 20, band: "0-3000", order: "rand", look: true },
  level: 1, done: 0, mistakes: 0, seed: (Math.random() * 2 ** 31) | 0, pos: 0, pseed: (Math.random() * 2 ** 31) | 0, ppos: 0 });
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.settings) return Object.assign(defaults(), s); } catch (e) {} return defaults(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();

/* ---------- rng ---------- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd = Math.random) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const pick = a => a[(Math.random() * a.length) | 0];

function wordDeck() {
  const [a, b] = S.settings.band.split("-").map(Number);
  const ids = [];
  for (let i = a; i < Math.min(b, VOCAB.length); i++) if (VOCAB[i].forms.length > 1) ids.push(i);
  return S.settings.order === "freq" ? ids : shuffle(ids, mulberry(S.seed));
}
function phraseDeck() { return shuffle(PHRASES.map((_, i) => i), mulberry(S.pseed)); }
let DECK = wordDeck(), PDECK = phraseDeck();

/* ---------- distractors ---------- */
function distractors(n, exclude, seeds) {
  const out = new Set();
  const ok = f => !exclude.has(f) && !out.has(f);
  const [a, b] = S.settings.band.split("-").map(Number);
  if (seeds) for (const f of shuffle([...seeds])) { if (out.size >= Math.ceil(n / 3)) break; if (ok(f)) out.add(f); }
  if (S.settings.look) {
    const cands = [];
    for (const t of exclude) for (const f of (BY_PREFIX.get(t.slice(0, 3)) || [])) if (ok(f)) cands.push(f);
    for (const f of shuffle(cands)) { if (out.size >= Math.ceil(n / 2)) break; if (ok(f)) out.add(f); }
  }
  let guard = 0;
  while (out.size < n && guard++ < 5000) {
    const lo = Math.max(0, a - 300), hi = Math.min(VOCAB.length, b + 300);
    const v = VOCAB[lo + ((Math.random() * (hi - lo)) | 0)];
    const f = pick(v.forms).f;
    if (ok(f)) out.add(f);
  }
  return [...out];
}

/* ---------- level state ---------- */
let L = null;                   // current level
const $ = id => document.getElementById(id);
const board = $("board"), tilesEl = $("tiles");
const isPhraseLevel = n => n % 7 === 0;

function newLevel() {
  if (isPhraseLevel(S.level)) buildPhrase(); else buildWord();
  render();
}
function wantCount(min) { return Math.max(min + 2, Math.min(40, Math.max(4, S.settings.count | 0 || 20))); }

function buildWord() {
  if (S.pos >= DECK.length) { S.seed = (Math.random() * 2 ** 31) | 0; S.pos = 0; DECK = wordDeck(); }
  const v = VOCAB[DECK[S.pos]];
  const target = new Set(v.forms.map(x => x.f));
  const n = wantCount(target.size);
  const tiles = shuffle([...target, ...distractors(n - target.size, target)]);
  L = { kind: "word", v, target, found: new Set(), tiles, levelMiss: 0, open: false, complete: false };
}

function buildPhrase() {
  if (S.ppos >= PDECK.length) { S.pseed = (Math.random() * 2 ** 31) | 0; S.ppos = 0; PDECK = phraseDeck(); }
  const ph = PHRASES[PDECK[S.ppos]];
  const parts = ph.sv.split(/([A-Za-zÅÄÖåäöÉéü]+)/);
  const counts = {};
  parts.forEach((p, i) => { if (i % 2) counts[p.toLowerCase()] = (counts[p.toLowerCase()] || 0) + 1; });
  const elig = [];
  parts.forEach((p, i) => { const w = p.toLowerCase(); if (i % 2 && w.length >= 2 && counts[w] === 1 && OWNERS.has(w)) elig.push(i); });
  const weak = i => { const own = OWNERS.get(parts[i].toLowerCase()); return own.every(o => VOCAB[o].rank < 40 || VOCAB[o].uninfl); };
  const strong = shuffle(elig.filter(i => !weak(i))), rest = shuffle(elig.filter(weak));
  const blanks = [...strong, ...rest].slice(0, 2).sort((a, b) => a - b);
  const answers = blanks.map(i => parts[i].toLowerCase());
  const exclude = new Set(answers);
  const seeds = new Set();
  answers.forEach(w => OWNERS.get(w).forEach(o => VOCAB[o].forms.forEach(x => seeds.add(x.f))));
  const n = wantCount(answers.length);
  const tiles = shuffle([...answers, ...distractors(n - answers.length, exclude, seeds)]);
  L = { kind: "phrase", ph, parts, blanks, answers, filled: new Set(), tiles, levelMiss: 0, complete: false };
}

/* ---------- rendering ---------- */
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function coreHTML() {
  if (L.kind === "word") {
    const v = L.v, total = L.target.size;
    const rows = v.forms.map(x => L.found.has(x.f)
      ? `<li data-f="${esc(x.f)}"><span class="f">${esc(x.f)}</span><span class="lab">${esc(x.lab)}</span></li>`
      : `<li class="todo"><span class="f">···</span><span class="lab">${L.complete ? esc(x.lab) : ""}</span></li>`).join("");
    const long = v.l.length > 9 ? " long" : "";
    return `<div class="disc"><div class="lemma${long}" lang="sv">${esc(v.l)}</div><div class="pos">${esc(v.pos)}</div></div>
      <button class="stack-toggle" id="tog" type="button" aria-expanded="${L.open}" aria-controls="stack">${L.found.size} av ${total} former ${L.open ? "▴" : "▾"}</button>
      <ol class="stack" id="stack" ${L.open ? "" : "hidden"}>${rows}
      ${L.complete && L.showEn ? `<li class="en-row"><span class="en-lab">English</span><span class="en" lang="en">${esc(GLOSS[v.rank] || "–")}</span></li>` : ""}
      ${L.complete ? `<li class="done-row">${transBtn()}<button class="btn primary" id="next" type="button">Nästa ord</button></li>` : ""}</ol>`;
  }
  const html = L.parts.map((p, i) => {
    const bi = L.blanks.indexOf(i);
    if (bi < 0) return esc(p);
    const filled = L.filled.has(bi);
    return `<span class="blank${filled ? " filled" : ""}" aria-label="${filled ? esc(p) : "lucka"}">${esc(p)}</span>`;
  }).join("");
  return `<div class="phrase-card"><div class="phrase-tag">Fras – fyll i ${L.blanks.length === 1 ? "ordet" : "orden"} som saknas</div>
    <div class="phrase" lang="sv">${html}</div>
    <div class="gloss" lang="en">${L.complete && L.showEn ? esc(L.ph.en) : ""}</div>
    ${L.complete ? `<div class="done-row">${transBtn()}<button class="btn primary" id="next" type="button">Nästa ord</button></div>` : ""}</div>`;
}

function transBtn() {
  return `<button class="btn" id="trans" type="button" aria-pressed="${!!L.showEn}">${L.showEn ? "Hide translation" : "Translate"}</button>`;
}
function render() {
  updateStats();
  board.querySelector(".core")?.remove();
  const core = document.createElement("div");
  core.className = "core";
  core.innerHTML = coreHTML();
  board.appendChild(core);
  tilesEl.innerHTML = L.tiles.map((f, i) => `<button class="tile" type="button" data-i="${i}" lang="sv">${esc(f)}</button>`).join("");
  wireCore();
  layout();
}
function refreshCore() {
  const core = board.querySelector(".core");
  core.innerHTML = coreHTML();
  wireCore();
  layout(true);
}
function wireCore() {
  const tog = $("tog");
  if (tog) tog.onclick = () => { L.open = !L.open; refreshCore(); };
  const tr = $("trans");
  if (tr) tr.onclick = () => { L.showEn = !L.showEn; refreshCore(); $("trans")?.focus({ preventScroll: true }); };
  const nx = $("next");
  if (nx) { nx.onclick = advance; if (!document.activeElement || document.activeElement.id !== "trans") nx.focus({ preventScroll: true }); }
}

/* target card on top, candidate words flow below it */
function layout() {
  board.classList.add("grid");
  board.style.height = "";
}
function arcPoints(rx, ry, n, offset) {
  const N = 720, pts = [], len = [0];
  for (let i = 0; i <= N; i++) { const a = -Math.PI / 2 + (i / N) * 2 * Math.PI; pts.push([rx * Math.cos(a), ry * Math.sin(a)]); }
  for (let i = 1; i <= N; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = len[N], out = [];
  let j = 0;
  for (let s = 0; s < n; s++) {
    const target = ((s + offset + 0.25) / n) * total;
    while (j < N && len[j + 1] < target) j++;
    out.push(pts[j]);
  }
  return out;
}

/* ---------- interaction ---------- */
tilesEl.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (!t || !L || L.complete) return;
  const f = L.tiles[+t.dataset.i];
  if (L.kind === "word") {
    if (L.target.has(f) && !L.found.has(f)) { L.found.add(f); correct(t, f); if (L.found.size === L.target.size) finish(); }
    else wrong(t, f);
  } else {
    const bi = L.answers.findIndex((a, i) => a === f && !L.filled.has(i));
    if (bi >= 0) { L.filled.add(bi); correct(t, f); if (L.filled.size === L.answers.length) finish(); }
    else wrong(t, f);
  }
});

const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function correct(t, f) {
  t.classList.add("right");
  say(`Rätt: ${f}`);
  const grid = board.classList.contains("grid");
  const fly = () => {
    if (!grid && !reduce.matches) {
      const core = board.querySelector(".core");
      const x = board.clientWidth / 2 - t.offsetWidth / 2, y = board.clientHeight / 2 - t.offsetHeight / 2;
      t.style.transform = `translate(${x}px,${y}px) scale(.6)`;
      void core;
    }
    t.classList.add("gone");
  };
  setTimeout(fly, reduce.matches ? 0 : 220);
  refreshCore();
  const li = board.querySelector(`.stack li[data-f="${CSS.escape(f)}"]`);
  if (li) li.classList.add("new");
}
function wrong(t, f) {
  S.mistakes++; L.levelMiss++;
  t.classList.add("wrong");
  say(`Fel: ${f}`);
  setTimeout(() => { t.classList.remove("wrong"); t.classList.add("spent"); }, 420);
  updateStats(); save();
}
function finish() {
  L.complete = true;
  if (L.kind === "word") L.open = true;
  S.done++;
  save();
  updateStats();
  setTimeout(() => {
    tilesEl.querySelectorAll(".tile:not(.gone)").forEach(t => t.classList.add("spent"));
    refreshCore();
    if (S.done % 50 === 0) celebrate();
  }, reduce.matches ? 0 : 450);
}
function advance() {
  if (L.kind === "word") S.pos++; else S.ppos++;
  S.level++;
  save();
  newLevel();
}
function say(msg) { $("live").textContent = msg; }

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && L && L.complete && !document.querySelector(".overlay")) {
    const a = document.activeElement;
    if (a && /^(BUTTON|INPUT|SELECT)$/.test(a.tagName)) return;
    e.preventDefault(); advance();
  }
});

function updateStats() {
  $("sLevel").textContent = S.level;
  $("sDone").textContent = S.done;
  $("sMiss").textContent = S.mistakes;
  const r = S.done % 50;
  $("pBar").style.width = (r / 50 * 100) + "%";
  const left = 50 - r;
  $("pNote").textContent = `${left} ${left === 1 ? "nivå" : "nivåer"} kvar till nästa fyrverkeri · var 7:e nivå är en fras`;
}

/* ---------- controls ---------- */
function syncControls() {
  $("cCount").value = S.settings.count; $("cBand").value = S.settings.band;
  $("cOrder").value = S.settings.order; $("cLook").checked = S.settings.look;
}
function onSettings(rebuildDeck) {
  S.settings.count = Math.max(4, Math.min(40, parseInt($("cCount").value, 10) || 20));
  S.settings.band = $("cBand").value; S.settings.order = $("cOrder").value; S.settings.look = $("cLook").checked;
  if (rebuildDeck) { S.seed = (Math.random() * 2 ** 31) | 0; S.pos = 0; DECK = wordDeck(); }
  save(); newLevel();
}
$("cCount").addEventListener("change", () => { onSettings(false); syncControls(); });
$("cBand").addEventListener("change", () => onSettings(true));
$("cOrder").addEventListener("change", () => onSettings(true));
$("cLook").addEventListener("change", () => onSettings(false));
$("bSkip").addEventListener("click", () => { if (L.kind === "word") S.pos++; else S.ppos++; save(); newLevel(); });
$("bReset").addEventListener("click", () => {
  if (!confirm("Nollställa nivå, klara ord och fel?")) return;
  const keep = S.settings; S = defaults(); S.settings = keep; DECK = wordDeck(); PDECK = phraseDeck(); save(); newLevel();
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => layout(true), 120); });

/* ---------- fireworks ---------- */
function celebrate() {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<canvas></canvas><div class="msg" role="dialog" aria-modal="true" aria-labelledby="cT">
    <h2 id="cT">${S.done} nivåer klara!</h2><p>Snyggt jobbat. ${S.mistakes} fel totalt hittills.</p>
    <button class="btn primary" type="button" id="cClose">Fortsätt spela</button></div>`;
  document.body.appendChild(ov);
  const close = () => { cancelAnimationFrame(raf); ov.remove(); $("next")?.focus(); };
  ov.querySelector("#cClose").onclick = close;
  ov.querySelector("#cClose").focus();
  let raf = 0;
  if (reduce.matches) return;
  const cv = ov.querySelector("canvas"), ctx = cv.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  size();
  const cols = ["#F4C430", "#FFFFFF", "#78AEE0", "#1D5C96", "#FFD95A"];
  const parts = [], rockets = [];
  const t0 = performance.now();
  let lastLaunch = 0;
  function launch() {
    rockets.push({ x: (0.15 + Math.random() * 0.7) * cv.width, y: cv.height, vy: -(9 + Math.random() * 4) * dpr, ty: (0.15 + Math.random() * 0.35) * cv.height, c: pick(cols) });
  }
  function burst(x, y, c) {
    const n = 70 + (Math.random() * 40 | 0);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 4.5) * dpr;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: Math.random() < .25 ? "#FFFFFF" : c });
    }
  }
  function frame(t) {
    const el = t - t0;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = "lighter";
    if (el < 3800 && t - lastLaunch > 260) { launch(); lastLaunch = t; }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.y += r.vy;
      ctx.fillStyle = r.c; ctx.fillRect(r.x - dpr, r.y, 2 * dpr, 6 * dpr);
      if (r.y <= r.ty) { burst(r.x, r.y, r.c); rockets.splice(i, 1); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.06 * dpr; p.vx *= .985; p.vy *= .985; p.life -= .012;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2 * dpr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (el < 6500 || parts.length) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

/* ---------- start ---------- */
if (innerWidth < 560) $("settings").open = false;
syncControls();
newLevel();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
window.__formjakt = { S: () => S, L: () => L, VOCAB, PHRASES, advance, celebrate };
</script>
</body>
</html>
